name: Docs

# Builds the VitePress site in docs/ and deploys it to GitHub Pages. Runs
# again after each Release so the download section reflects the new version.
# Pages must be enabled once in the repository settings with "GitHub Actions"
# as the source.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - packages/cli/package.json
      - pnpm-lock.yaml
      - .github/workflows/docs.yml
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v5
      # base_path is "/yunbox" on github.io and empty with a custom domain.
      - run: pnpm --filter @yunbox/docs build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
