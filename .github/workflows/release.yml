name: Release

# Publishes the `yunbox` CLI to npm when a v* tag is pushed ("pnpm release"
# bumps packages/cli/package.json, commits, tags and pushes), then creates the
# GitHub release with the notarized macOS client attached. Uses npm
# trusted publishing (OIDC): no token is stored anywhere. npmjs.com trusts
# this repository, this workflow file (release.yml) and the `npm`
# environment; provenance is attached automatically.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing and provenance

jobs:
  publish:
    name: Publish yunbox to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Tag must match the CLI version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match packages/cli version $version"; exit 1; }

      # The GitHub release and the app's update prompt quote this version's notes.
      - name: The changelog must describe this version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          node script/changelog.mjs notes "$version" zh >/dev/null
          node script/changelog.mjs notes "$version" en >/dev/null

      - name: Install git-lfs
        run: |
          sudo apt-get update
          sudo apt-get install --yes git-lfs
          git lfs install --skip-repo

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Trusted publishing needs npm 11.5.1+; the bundled npm depends on the Node.js version.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install --global npm@11
          npm --version

      # pnpm pack rewrites workspace: ranges; npm publishes the tarball over OIDC.
      - name: Publish
        working-directory: packages/cli
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          npm publish "$RUNNER_TEMP"/yunbox-*.tgz --access public

  # The release itself is created here, after npm publishing succeeded, so a
  # tag whose checks fail never gets a downloadable app. The app is signed
  # with the Developer ID certificate (DEVELOPER_ID_P12_BASE64 and
  # DEVELOPER_ID_P12_PASSWORD) and notarized with an App Store Connect API key
  # (APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY), so Gatekeeper opens
  # it without asking. Installed clients update themselves through Sparkle
  # from the appcast.xml attached here; it and the zip are signed with the
  # SPARKLE_ED_PRIVATE_KEY secret, whose public half is SUPublicEDKey in
  # script/build_and_run.sh. All secrets live in the `sparkle` environment;
  # see apps/macos/README.md.
  macos-app:
    name: Attach the macOS client to the GitHub release
    needs: publish
    runs-on: xcode-27
    timeout-minutes: 30
    environment: sparkle
    permissions:
      contents: write # create the release and upload the zip
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A keychain of its own, deleted when the job ends, holds the certificate.
      - name: Import the Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          test -n "$DEVELOPER_ID_P12_BASE64" && test -n "$DEVELOPER_ID_P12_PASSWORD" \
            || { echo "::error::DEVELOPER_ID_P12_BASE64 and DEVELOPER_ID_P12_PASSWORD must be set; see apps/macos/README.md"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          (umask 077 && printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12")
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          # Keep the existing search list behind the new keychain.
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | sed 's/^ *"//; s/"$//')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          test -n "$identity" || { echo "::error::the certificate is not a Developer ID Application certificate"; exit 1; }
          echo "YUNBOX_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build a universal YunBox.app
        env:
          YUNBOX_SWIFT_BUILD_ARGS: -c release --arch arm64 --arch x86_64
        run: |
          ./script/build_and_run.sh --build
          lipo dist/YunBox.app/Contents/MacOS/YunBox -verify_arch arm64
          lipo dist/YunBox.app/Contents/MacOS/YunBox -verify_arch x86_64

      # Before the appcast: the zip Sparkle signs must hold the stapled app.
      - name: Notarize the app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER_ID" && test -n "$APPLE_API_KEY" \
            || { echo "::error::APPLE_API_KEY_ID, APPLE_API_ISSUER_ID and APPLE_API_KEY must be set; see apps/macos/README.md"; exit 1; }
          ./script/notarize.sh dist/YunBox.app

      # A draft until both files are attached: releases/latest must never point
      # at a release without appcast.xml, or every client's check fails.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node script/changelog.mjs github "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --title "$GITHUB_REF_NAME"

      - name: Sign the update and generate the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_ED_PRIVATE_KEY" || { echo "::error::SPARKLE_ED_PRIVATE_KEY is not set; see apps/macos/README.md"; exit 1; }
          ./script/sparkle_appcast.sh dist/YunBox.app "$GITHUB_REF_NAME" dist/sparkle

      # The docs site links to releases/latest/download/YunBox-macOS.zip and
      # the app reads releases/latest/download/appcast.xml.
      - name: Upload to the GitHub release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/sparkle/YunBox-macOS.zip dist/sparkle/appcast.xml --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Delete the signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
