ignoreWorkspaceRootCheck: true
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

packages:
  - packages/*

allowBuilds:
  esbuild: true

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@antfu/ni': ^30.6.0
  '@types/node': ^24.19.2
  eslint: ^10.12.0
  tsdown: ^0.23.1
  tsx: ^4.23.15
  typescript: ^6.0.3
  vitest: ^5.0.3
