ignoreWorkspaceRootCheck: true
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

packages:
  - packages/*
  - docs

# Dev-only: @antfu/eslint-config -> @eslint/markdown -> micromark-extension-math
# pins katex ^0.16, which has a prototype pollution advisory fixed in 0.18.2.
overrides:
  katex: ^0.18.2

allowBuilds:
  esbuild: true

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@antfu/ni': ^30.6.0
  '@cloudbase/signature-nodejs': ^2.0.0
  '@smithy/signature-v4': ^5.7.4
  '@types/node': ^24.19.2
  bumpp: ^12.3.0
  cos-nodejs-sdk-v5: ^3.0.0
  eslint: ^10.12.0
  tsdown: ^0.23.1
  tsx: ^4.23.15
  typescript: ^6.0.3
  vitepress: ^2.0.0-alpha.20
  vitest: ^5.0.3
  vue: ^3.5.44
  vue-tsc: ^3.3.13
