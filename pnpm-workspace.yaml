ignoreWorkspaceRootCheck: true
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

packages:
  - packages/*

# Dev-only: @antfu/eslint-config -> @eslint/markdown -> micromark-extension-math
# pins katex ^0.16, which has a prototype pollution advisory fixed in 0.18.2.
overrides:
  katex: ^0.18.2

allowBuilds:
  esbuild: true

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@antfu/ni': ^30.6.0
  '@cloudbase/signature-nodejs': ^2.0.0
  '@types/node': ^24.19.2
  cos-nodejs-sdk-v5: ^3.0.0
  eslint: ^10.12.0
  tsdown: ^0.23.1
  tsx: ^4.23.15
  typescript: ^6.0.3
  vitest: ^5.0.3
